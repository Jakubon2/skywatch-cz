# Runtime configuration. Detector thresholds will be added here in phase 1.

source:
  # Any readsb-compatible API (adsb.lol, airplanes.live, adsb.fi) uses the same response format.
  base_url: https://api.adsb.lol
  center_lat: 49.8
  center_lon: 15.5
  radius_nm: 160

poller:
  interval_s: 10          # adsb.lol: at most one request every 10 s
  max_backoff_s: 300      # cap for exponential backoff on HTTP 429 / network errors
  history_minutes: 15     # track history kept in memory per aircraft
  request_timeout_s: 15
  # Not aircraft: ground stations, towers and airport vehicles that also transmit ADS-B
  # (often with made-up altitudes). Dropped right at ingest, so map, chat, stats and detectors never see them.
  non_aircraft_types: [TWR, GND]
  non_aircraft_categories: [C1, C2, C3, C4, C5, C6, C7]

explain:
  model: claude-haiku-5-5
  effort: low               # short layperson explanations; raise if quality is lacking
  max_tokens: 4000
  max_calls_per_hour: 30    # hard cap on Claude API calls (rolling hour); above it events stay unexplained
  track_minutes: 10         # how much track history goes into the prompt
  track_points: 6           # number of summary points from that window
  metar_station: LKPR
  metar_refresh_minutes: 10

chat:
  model: claude-haiku-5-5
  effort: low
  max_tokens: 8000
  max_calls_per_hour: 60    # hard cap on chat questions (rolling hour); above it /api/chat returns 429
  max_tool_iterations: 6    # Claude API calls per question (tool loop) before giving up
  max_history_messages: 20  # how much of the conversation is sent back
  list_limit: 15            # aircraft listed by search_aircraft (count is always exact)
  top_n: 5                  # top airlines/types in stats

history:
  sample_s: 30              # at most one stored position per aircraft every N seconds
  retention_hours: 24       # older positions are deleted
  prune_every_minutes: 10
  stale_s: 90               # a playback frame shows aircraft whose last position is at most this old
  max_frames: 240           # /api/history raises `step` to stay within this many frames
  stats_cache_s: 60         # /api/stats result cache
  stats_top_n: 10

daily_summary:
  enabled: false            # set true to send the evening summary via ntfy + Web Push
  at: "20:00"               # Europe/Prague local time
  model: claude-haiku-5-5
  effort: low
  max_tokens: 4000
  max_calls_per_day: 6      # hard cap on Claude calls (rolling 24 h), previews included
  cache_minutes: 30         # /api/summary/today reuses the last text this long
  max_events: 15            # latest events of the day passed to the prompt

weekly_summary:             # last 7 days; model, effort and the call cap are shared with daily_summary
  enabled: false            # set true to send it via ntfy + Web Push
  weekday: 6                # 0 = Monday ... 6 = Sunday
  at: "20:30"               # Europe/Prague local time (after the daily one, so they don't arrive together)
  cache_minutes: 60         # /api/summary/week reuses the last text this long

enrich:
  route:                    # adsb.lol route API; shares politeness with the poller, so cache hard
    url: https://api.adsb.lol/api/0/routeset
    fallback_url: https://api.adsbdb.com/v0/callsign/{callsign}   # used when adsb.lol has no route
    cache_hours: 6
    miss_cache_minutes: 60
    min_interval_s: 10
    max_per_hour: 30
  photo:                    # planespotters.net public API (attribution required in the UI)
    url: https://api.planespotters.net/pub/photos
    cache_hours: 24
    miss_cache_minutes: 360
    min_interval_s: 1
    max_per_hour: 120
  aircraft:                 # adsbdb.com registry: full type name, manufacturer, owner, country
    url: https://api.adsbdb.com/v0/aircraft/{hex}
    cache_hours: 72
    miss_cache_minutes: 360
    min_interval_s: 2
    max_per_hour: 120

noise:                      # rough noise estimate over an address (/api/noise); see backend/noise.py
  ref_distance_m: 305       # reference levels below are LAmax at this slant distance (1000 ft)
  ref_db:                   # dB(A) at ref_distance_m, take-off/climb thrust
    light: 75               # single-engine piston, small twins
    regional: 83            # ATR, Dash 8, CRJ, E-jets, business jets
    narrowbody: 88          # A320 family, B737
    widebody: 93            # A330/A350, B777/B787, B747, A380
    rotorcraft: 85
  phase_offset_db:          # added to ref_db by flight phase
    climb: 0
    approach: -2            # descending, or level below low_level_ft
    cruise: -8              # level at altitude: reduced thrust
  climb_fpm: 500            # baro_rate above this = climb, below minus this = descent
  low_level_ft: 8000
  absorption_db_per_km: 1.5 # effective A-weighted atmospheric absorption (broadband aircraft spectrum)
  min_slant_m: 100
  observer_elev_m: 250      # assumed ground elevation (alt_baro is above sea level)
  max_radius_km: 50
  category_class:           # ADS-B emitter category -> class
    A1: light
    A2: regional
    A3: narrowbody
    A4: narrowbody
    A5: widebody
    A7: rotorcraft
    B4: light
  type_class:               # ICAO type -> class, overrides category (also covers aircraft without category)
    widebody: [A332, A333, A338, A339, A343, A346, A359, A35K, A388, B744, B748, B762, B763, B764, B772, B77L, B77W, B778, B779, B788, B789, B78X, A124, A400, C17, IL76, MD11]
    narrowbody: [A318, A319, A320, A321, A19N, A20N, A21N, B736, B737, B738, B739, B37M, B38M, B39M, B752, B753, BCS1, BCS3]
    regional: [AT43, AT45, AT72, AT75, AT76, DH8A, DH8B, DH8C, DH8D, CRJ2, CRJ7, CRJ9, CRJX, E170, E175, E190, E195, E290, E295, SF34, C25A, C25B, C56X, C68A, CL35, GLF6, GLEX, F2TH, PC12, L410]
    rotorcraft: [EC35, EC45, EC135, H135, H145, EC30, A139, AS50, R44, R22, B06, MI8, UH1, S76]
  labels:                   # upper bound (exclusive) -> Czech comparison
    - [20, "téměř neslyšitelné"]
    - [30, "jako šepot"]
    - [40, "jako tichá knihovna"]
    - [50, "jako tichá kancelář"]
    - [60, "jako běžný rozhovor"]
    - [70, "jako rušná ulice"]
    - [80, "jako vysavač"]
    - [90, "jako projíždějící kamion"]
    - [999, "jako sbíječka"]

contrails:                  # contrail forecast (/api/contrails); see backend/contrails.py
  url: https://api.open-meteo.com/v1/forecast
  levels_hpa: [300, 250, 200]
  horizon_hours: 12         # hours used for the summary
  cache_minutes: 30         # per location rounded to round_deg
  round_deg: 0.1
  propulsion_efficiency: 0.35  # overall efficiency eta of a modern turbofan (Schumann 2000: ~0.3-0.4)
  ei_h2o: 1.25              # kg water per kg kerosene
  fuel_heat: 43200000        # J/kg, lower heating value of kerosene
  persistent_rhi: 100       # % RH over ice for persistence; NWP models tend to underestimate supersaturation
  overcast_cover: 85        # % cloud cover above which trails are probably hidden
  timeout_s: 10

passes:                     # compact long-term pass history for flight predictions
  cell_lat_deg: 0.2         # grid cell ~22 km tall; predictions are only this precise
  cell_lon_deg: 0.3         # ~22 km wide at 50°N
  retention_days: 30
  min_history_days: 3       # fewer past days with data -> empty list + reason
  min_days_seen: 3          # a callsign must recur at a similar time on this many days
  cluster_minutes: 45       # "similar time" = within ±45 min
  grace_minutes: 15         # also list flights due up to 15 min ago
  max_results: 30

pass_alerts:                 # heads-up push/ntfy before a predicted pass (opt-in per device, backend/pass_alerts.py)
  enabled: true
  lead_minutes: 20          # notify when a pass is expected within this many minutes
  min_confidence: 0.5       # skip predictions seen on fewer than half of the observed days
  check_every_s: 60

board:                      # LKPR arrivals/departures board (/api/board, backend/board.py); estimate from ADS-B
  airport: LKPR
  radius_km: 150            # aircraft farther away are ignored
  ground_radius_km: 4       # "on the ground at the airport"
  ground_max_agl_ft: 200    # numeric altitude this close to the field + slow = on the ground
  ground_max_gs_kt: 80
  taxi_min_kt: 5            # on the ground and faster than this = moving (taxi / take-off roll)
  descent_fpm: 300          # baro_rate below minus this = descending
  climb_fpm: 300            # baro_rate above this = climbing
  arrival_max_alt_ft: 18000 # heuristic arrivals (no route) must be below this
  approach_radius_km: 25    # level flight this close and low still counts as an arrival
  approach_max_agl_ft: 5000
  toward_max_deg: 60        # track within this of the bearing to the airport = heading toward it
  departure_radius_km: 60   # heuristic departures (no route) must be this close
  departure_max_alt_ft: 18000
  eta_path_factor: 1.15     # real approach path is longer than the straight line
  departed_speed_factor: 0.7  # average speed since take-off vs current gs, when the track doesn't show it
  max_rows: 12              # per list
  exclude_types: [TWR, GND, GRND, SERV, EMER, BALL]   # ADS-B ground vehicles/beacons, not flights
  exclude_categories: [C0, C1, C2, C3, C4, C5]         # surface vehicles and obstacles
  route_candidate_max_alt_ft: 25000  # only look up routes for aircraft below this (or on the ground)
  route_lookups_per_request: 2       # background lookups started by one /api/board call
  route_lookups_per_hour: 15         # board's own share of enrich.route's budget

map_layers:                 # optional map overlays (backend/airspace.py, frontend MapLayers.jsx)
  radar:                    # RainViewer public API, free tier: personal use, attribution required
    url: https://api.rainviewer.com/public/weather-maps.json
    cache_minutes: 5        # frames come every 10 min
    color_scheme: 2         # "Universal Blue", the only scheme on the free tier
    max_native_zoom: 7      # free tier serves real tiles up to z7; Leaflet upscales above
    opacity: 0.6
  airspace:                 # openAIP (CC BY-NC 4.0); OPENAIP_API_KEY in .env switches to the REST API
    country: CZ
    export_url: https://storage.openaip.net/openaip-system-exports/{country}_asp.geojson
    api_url: https://api.core.openaip.net/api/airspaces
    cache_hours: 24         # also kept on disk in data/, so restarts don't refetch
    timeout_s: 20
    # openAIP type codes drawn on the map -> short label. Gliding sectors, drop zones, FIR... left out.
    types: {1: R, 2: D, 3: P, 4: CTR, 5: TMZ, 6: RMZ, 7: TMA, 8: TRA, 9: TSA, 13: ATZ, 26: CTA, 36: MCTR}

what_was_that:              # "Co to bylo?" (/api/what-was-that, backend/whatwasthat.py)
  default_window_s: 150     # "now": look this far back (the plane you just heard)
  past_window_s: 300        # a chosen time: ± this many seconds around it
  max_window_s: 1800
  max_distance_km: 15       # ignore passes whose closest point is farther than this (horizontal)
  max_gap_s: 100            # don't interpolate across a gap in the track longer than this
  top_n: 4                  # candidates returned
  route_top_n: 2            # route lookups (enrich.route, cached + rate limited) for the first N
  route_timeout_s: 2.5      # answer without the route rather than wait for the rate limiter
  path_pad_s: 120           # track returned around the closest point, for drawing on the map
  unknown_class: regional   # noise class for aircraft without type/category (ranked, but no "heavy" claim)
  overhead_km: 2            # closer than this (horizontal) = "nad tebou", else "kolem tebe"
  just_now_s: 15            # closest point less than this ago = "právě teď … letí" (may still be approaching)
  reasons:                  # why it was loud; each only when the data shows it
    low_height_m: 1500      # height above ground below this = "letěl nízko"
    takeoff_max_height_m: 3000   # climbing below this height = "stoupal po startu", above = "stoupal"
    climb_ms: 2.5           # vertical speed above this = climbing (m/s)
    close_slant_km: 2.5     # slant distance below this = "byl blízko"
    loud_db: 65             # estimate at/above this = "proto byl tak hlasitý"
    quiet_db: 50            # top estimate below this = admit it was probably not loud
  type_names:               # ICAO type -> name for the sentence (interesting_types.yaml is used too)
    A318: Airbus A318
    A319: Airbus A319
    A320: Airbus A320
    A321: Airbus A321
    A19N: Airbus A319neo
    A20N: Airbus A320neo
    A21N: Airbus A321neo
    A332: Airbus A330
    A333: Airbus A330
    A339: Airbus A330neo
    A343: Airbus A340
    A359: Airbus A350
    A35K: Airbus A350-1000
    BCS1: Airbus A220
    BCS3: Airbus A220
    B733: Boeing 737
    B734: Boeing 737
    B737: Boeing 737
    B738: Boeing 737
    B739: Boeing 737
    B37M: Boeing 737 MAX
    B38M: Boeing 737 MAX
    B39M: Boeing 737 MAX
    B752: Boeing 757
    B763: Boeing 767
    B772: Boeing 777
    B77L: Boeing 777
    B77W: Boeing 777
    B778: Boeing 777X
    B779: Boeing 777X
    B788: Boeing 787
    B789: Boeing 787
    B78X: Boeing 787
    E170: Embraer 170
    E175: Embraer 175
    E190: Embraer 190
    E195: Embraer 195
    E290: Embraer 190-E2
    E295: Embraer 195-E2
    CRJ9: Bombardier CRJ900
    AT72: ATR 72
    AT75: ATR 72
    AT76: ATR 72
    DH8D: Dash 8
    MD11: McDonnell Douglas MD-11
    C172: Cessna 172
    C152: Cessna 152
    C182: Cessna 182
    P28A: Piper PA-28
    DA40: Diamond DA40
    DA42: Diamond DA42
    SR22: Cirrus SR22
    PC12: Pilatus PC-12
    L410: Let L-410
    EC35: Airbus H135
    H135: Airbus H135
    EC45: Airbus H145
    H145: Airbus H145
    A139: Leonardo AW139

flights:                    # "Moje lety": track one flight by number, push on take-off/approach/landing (backend/flights.py)
  airline_codes: airline_codes.yaml  # IATA (OK, FR) -> ICAO callsign prefix (CSA, RYR)
  max_per_device: 5
  max_total: 40
  # Flights outside our area come from adsb.lol /v2/callsign. To stay at one adsb.lol request per 10 s,
  # such a lookup replaces one area snapshot, at most once per this many seconds (round robin over flights).
  global_every_s: 60
  lost_after_s: 900         # not seen this long = signal lost (or landed, see landed_guess_*)
  landed_guess_km: 25       # lost this close to the destination...
  landed_guess_max_ft: 6000 # ...and this low = most likely landed (coverage ends near the ground)
  approach_km: 60           # within this distance of the destination...
  approach_max_ft: 12000    # ...and below this = "přistává", one push with the ETA
  ground_max_kt: 50         # numeric altitude but slower than this = on the ground
  eta_path_factor: 1.15     # real path is longer than the straight line
  route_retry_s: 300        # route lookup failed: try again after this
  keep_landed_h: 6          # landed flights disappear after this
  keep_waiting_h: 36        # never-seen flights disappear after this

watched_history:            # past sightings of watched (celebrity) aircraft, backend/watched_history.py
  new_sighting_gap_min: 45  # unseen longer than this = the next sighting is a new visit
  airport_max_km: 8         # first/last position this close to an airport...
  airport_max_ft: 4000      # ...and this low = took off from / landed at that airport
  keep_days: 365
